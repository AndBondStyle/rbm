services:
  ros:
    image: registry.robotics-lab.ru/robomarvel:v4
    build: .
    container_name: ros
    privileged: true
    restart: always
    entrypoint: ["/src/entrypoint.sh"]
    ports: [8765:8765, 8080:8080]
    volumes:
      - ".:/src"
      - "/dev:/dev"
      - "/run/udev:/run/udev:ro"
