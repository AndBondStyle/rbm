services:
  ros:
    image: registry.robotics-lab.ru/robomarvel:v5
    build: .
    platform: linux/arm64
    container_name: ros
    privileged: true
    restart: always
    entrypoint: ["/src/entrypoint.sh"]
    ports:
      - 8765:8765      # Foxglove Websocket
      - 8080:8080      # Generic HTTP
      - 8889:8889      # MediaMTX HTTP
      - 8189:8189/udp  # MediaMTX WebRTC
    volumes:
      - ".:/src"
      - "/dev:/dev"
      - "/run/udev:/run/udev:ro"
